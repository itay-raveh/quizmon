name: Publish release

on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      SENTRY_ORG:
        required: true
      SENTRY_BROWSER_PROJECT:
        required: true
      SENTRY_WORKER_PROJECT:
        required: true
      SENTRY_BROWSER_DSN:
        required: true
      SENTRY_WORKER_DSN:
        required: true

permissions: {}

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      MISE_LOCKED: 1
      QUIZMON_RELEASE_IMAGE: quizmon-release:checked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/infra
          path: .wrangler/infra
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node
          cache: false
      - run: npm ci
      - name: Validate chart and migration
        run: |
          mise install helm kubeconform
          node tests/online/check-helm-chart.ts
          docker compose -f compose.yaml up -d --wait db
          node tests/online/check-migrations.ts
      - name: Build and prepare Worker
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_BROWSER_PROJECT: ${{ secrets.SENTRY_BROWSER_PROJECT }}
          SENTRY_WORKER_PROJECT: ${{ secrets.SENTRY_WORKER_PROJECT }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_BROWSER_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_WORKER_DSN: ${{ secrets.SENTRY_WORKER_DSN }}
        run: |
          for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_BROWSER_PROJECT SENTRY_WORKER_PROJECT VITE_SENTRY_DSN SENTRY_WORKER_DSN; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
          npm run build
          npm run test:sync
          test -z "$(find dist -name '*.map' -print -quit)"
          node deploy/prepare-worker-deploy.ts .wrangler/infra
          npx wrangler deploy --config .wrangler.production.json --dry-run --upload-source-maps --outdir .wrangler/release-worker
          ./node_modules/.bin/sentry-cli sourcemaps inject .wrangler/release-worker
          ./node_modules/.bin/sentry-cli sourcemaps upload --strict --wait --release "$GITHUB_SHA" --org "$SENTRY_ORG" --project "$SENTRY_WORKER_PROJECT" .wrangler/release-worker
          test -f .wrangler/release-worker/index.js.map
      - name: Build checked migration image
        run: |
          mkdir -p .wrangler
          docker build -f deploy/runtime/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --iidfile .wrangler/release-image-id -t "$QUIZMON_RELEASE_IMAGE" .
          docker run --rm --entrypoint test "$QUIZMON_RELEASE_IMAGE" -f /opt/quizmon/server/migrations/meta/_journal.json
          docker run --rm --entrypoint test "$QUIZMON_RELEASE_IMAGE" -f /opt/quizmon/deploy/powersync/sync-config.yaml
      - name: Check real sync isolation
        run: |
          docker compose -f compose.yaml pull powersync
          export QUIZMON_PREBUILT_WORKER="$PWD/.wrangler/release-worker"
          node tests/online/check-runtime-config.ts
      - name: Publish checked migration image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          DOCKER_CONFIG: ${{ runner.temp }}/quizmon-registry-auth
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          public_config="$RUNNER_TEMP/quizmon-registry-public"
          trap 'rm -rf "$DOCKER_CONFIG" "$public_config"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          image_id=$(cat .wrangler/release-image-id)
          test "$(docker image inspect "$QUIZMON_RELEASE_IMAGE" --format '{{.Id}}')" = "$image_id"
          printf -v run_number '%09d' "$GITHUB_RUN_NUMBER"
          printf -v run_attempt '%03d' "$GITHUB_RUN_ATTEMPT"
          reference="ghcr.io/${GITHUB_REPOSITORY,,}/release:main-$run_number-$run_attempt-${GITHUB_SHA:0:12}"
          docker tag "$image_id" "$reference"
          docker push "$reference"
          digest_reference=$(docker image inspect "$reference" --format '{{index .RepoDigests 0}}')
          test "${digest_reference%@*}" = "${reference%:*}"
          mkdir -p "$public_config"
          if ! DOCKER_CONFIG="$public_config" docker pull "$digest_reference"; then
            echo '::error::The release image is not anonymously readable. Make the GHCR package public, then rerun this workflow.'
            exit 1
          fi
          printf '%s\n' "$digest_reference" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.127.1
          command: deploy .wrangler/release-worker/index.js --config .wrangler.production.json --no-bundle --keep-vars
      - name: Remove disposable database
        if: always()
        run: docker compose -f compose.yaml down --volumes
