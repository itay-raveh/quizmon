name: Publish release

on:
  workflow_call:

permissions: {}

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      MISE_LOCKED: 1
      QUIZMON_RELEASE_IMAGE: quizmon-release:checked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          install_args: node
      - run: npm ci
      - name: Package the candidate
        run: |
          npm run build
          npx wrangler deploy --config deploy/wrangler.jsonc --dry-run --outdir ../.wrangler/release-worker
          node deploy/package-release.ts .wrangler/release-candidate .wrangler/release-worker
      - name: Verify publication identity
        id: publication
        run: node deploy/plan-publication.ts .wrangler/release-candidate
      - name: Build the image once
        env:
          SOURCE_URL: ${{ steps.publication.outputs.sourceUrl }}
          SOURCE_REVISION: ${{ steps.publication.outputs.revision }}
        run: |
          docker build --label "org.opencontainers.image.source=$SOURCE_URL" --label "org.opencontainers.image.revision=$SOURCE_REVISION" --iidfile .wrangler/release-image-id -t "$QUIZMON_RELEASE_IMAGE" .wrangler/release-candidate
      - name: Publish the checked image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE_REFERENCE: ${{ steps.publication.outputs.reference }}
          DOCKER_CONFIG: ${{ runner.temp }}/quizmon-registry-auth
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          public_config="$RUNNER_TEMP/quizmon-registry-public"
          trap 'rm -rf "$DOCKER_CONFIG" "$public_config"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          image_id=$(cat .wrangler/release-image-id)
          test "$(docker image inspect "$QUIZMON_RELEASE_IMAGE" --format '{{.Id}}')" = "$image_id"
          docker tag "$image_id" "$RELEASE_REFERENCE"
          docker push "$RELEASE_REFERENCE"
          digest_reference=$(docker image inspect "$RELEASE_REFERENCE" --format '{{index .RepoDigests 0}}')
          test "${digest_reference%@*}" = "${RELEASE_REFERENCE%:*}"
          mkdir -p "$public_config"
          if ! DOCKER_CONFIG="$public_config" docker pull "$digest_reference"; then
            echo '::error::The release image is not anonymously readable. Make the GHCR package public, then rerun this workflow.'
            exit 1
          fi
          printf '%s\n' "$digest_reference" >> "$GITHUB_STEP_SUMMARY"
