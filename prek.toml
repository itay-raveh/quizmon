default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "check-added-large-files", args = ["--maxkb=2048"] },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "betterleaks"
name = "detect hardcoded secrets"
entry = "betterleaks git --pre-commit --staged --redact --no-banner --no-color ."
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "format"
name = "format"
entry = "npm run format:check"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "lint"
name = "lint"
entry = "npm run lint"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "commitlint"
name = "commitlint"
entry = "npm run commitlint -- --edit"
language = "system"
always_run = true
stages = ["commit-msg"]

[[repos.hooks]]
id = "full-check"
name = "full check"
entry = "mise run check"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
