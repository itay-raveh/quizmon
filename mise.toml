min_version = "2026.8.14"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[tools]
actionlint = "1.7.12"
betterleaks = "1.8.1"
helm = "4.3.0"
kubeconform = "0.8.0"
lychee = "0.24.2"
node = "24.20.0"
prek = "0.5.0"
shellcheck = "0.11.0"
"github:zizmorcore/zizmor" = "1.29.0"

[tasks.setup]
description = "Set up tools, dependencies, browser binaries, and Git hooks"
run = [
  "npm ci",
  "npx --no-install playwright install chromium",
  "prek install",
]

[tasks.check]
description = "Run every repository check without modifying files"
run = [
  "npm run format:check",
  "npm run lint",
  "betterleaks git --redact --no-banner --no-color .",
  "npm run check:dead-code",
  "npm test",
  "npm run test:online",
  "npm run check:chart",
  "npm run build",
  "prek validate-config prek.toml",
  "npm run deploy:dry-run",
  "actionlint",
  "zizmor --offline .github/workflows",
  "lychee --offline --include-fragments --root-dir \"$PWD/dist\" dist/index.html",
  "lychee --offline --include-fragments README.md",
]

[tasks."badges:export"]
description = "Export badge and trophy PNGs from Aseprite masters"
usage = '''
flag "--source <path>" help="Aseprite source file" default="art/badges.aseprite"
flag "--output <pattern>" help="PNG output pattern" default="src/assets/images/badges/{slice}.png"
'''
run = [
  'aseprite --batch "{{usage.source}}" --save-as "{{usage.output}}"',
  'aseprite --batch art/trophy.aseprite --save-as src/assets/images/trophy.png',
]
