name: quizmon
services:
  db:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    # Existing development volumes can still contain logical replication slots.
    command: [postgres, -c, wal_level=logical]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: quizmon
    ports:
      - '127.0.0.1:5548:5432'
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d quizmon]
      interval: 2s
      timeout: 2s
      retries: 20
  mongo:
    image: mongo:7.0.43@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo:/data/db
    healthcheck:
      test:
        [
          CMD-SHELL,
          "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  database:
  mongo:
