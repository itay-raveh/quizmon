name: quizmon-accounts-sync-pilot
services:
  db:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    command: [postgres, -c, wal_level=logical]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: quizmon_pilot
    ports:
      - 127.0.0.1:5548:5432
    volumes:
      - pilot-db:/var/lib/postgresql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/01-pilot.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d quizmon_pilot]
      interval: 2s
      timeout: 2s
      retries: 20
  powersync:
    image: journeyapps/powersync-service@sha256:39f6a534f757afd1c633e91a19b23fde03186d16b5543b4af0f5c8f09d4cb79d
    command: [start, -r, unified]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8089:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ./deploy/powersync:/config:ro
volumes:
  pilot-db:
